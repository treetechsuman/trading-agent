# /etc/ssh/sshd_config.d/10-hardening.conf
# Loaded before Vultr/cloud-init's 50-cloud-init.conf, and sshd uses the
# FIRST value it sees for each setting, so these win.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers trader
X11Forwarding no
